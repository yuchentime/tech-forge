routes:
  frontend-backend-code-placement:
    description: "Current Electron, React, NestJS runtime and code-placement guide"
    token_budget: 10000
    code_globs:
      - "apps/desktop/**"
      - "apps/backend/**"
    required:
      - docs/current/index.md
      - docs/current/platform/index.md
      - docs/current/platform/architecture-and-code-placement.md
    optional:
      - docs/source/data-model-design.md
      - docs/source/data-model-fields.md
      - docs/source/system-configuration-design.md
    history_on_demand: []
  data-model-implementation:
    description: "Implement or change persistence using the current candidate data model"
    token_budget: 14000
    code_globs:
      - "apps/backend/src/**"
    required:
      - docs/current/index.md
      - docs/current/platform/index.md
      - docs/current/platform/architecture-and-code-placement.md
      - docs/source/data-model-design.md
      - docs/source/data-model-fields.md
    optional:
      - docs/source/system-configuration-design.md
    history_on_demand: []
