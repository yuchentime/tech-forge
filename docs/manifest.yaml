      - docs/changes/2026-11-08-document-parser-adapter/design.md
    history_on_demand:
      - docs/changes/2026-11-08-knowledge-retrieval/worklog.md
      - docs/changes/2026-11-08-knowledge-retrieval/verification.md
  frontend-backend-code-placement:
