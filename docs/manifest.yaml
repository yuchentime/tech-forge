routes:
  frontend-backend-code-placement:
    description: "Current Electron, React, NestJS runtime and code-placement guide"
    token_budget: 10000
    code_globs:
      - "apps/desktop/**"
      - "apps/backend/**"
    required:
      - docs/current/index.md
      - docs/current/platform/index.md
      - docs/current/platform/architecture-and-code-placement.md
    optional:
      - docs/current/platform/agent-runtime.md
      - docs/source/data-model-design.md
      - docs/source/data-model-fields.md
      - docs/source/system-configuration-design.md
    history_on_demand: []
  agent-runtime:
    description: "Extend the Agent and Pi SDK request, tool, stream, and persistence lifecycle"
    token_budget: 14000
    code_globs:
      - "apps/backend/src/agent/**"
      - "apps/backend/src/conversations/**"
      - "apps/backend/src/llm/**"
      - "apps/desktop/src/features/agent/**"
      - "apps/desktop/src/types/**"
      - "apps/desktop/electron/**"
    required:
      - docs/current/index.md
      - docs/current/platform/index.md
      - docs/current/platform/agent-runtime.md
    optional:
      - docs/current/platform/architecture-and-code-placement.md
      - docs/current/domains/conversations/backend-behavior.md
      - docs/changes/2026-11-07-conversation-session-persistence/verification.md
      - docs/source/agent-runtime-open-questions.md
    history_on_demand: []
  agent-flow-logging:
    description: "Trace Agent requests across backend queueing, persistence, Pi/LLM, tools, and terminal outcomes with safe structured logs"
    token_budget: 16000
    code_globs:
      - "apps/backend/src/agent/**"
      - "apps/backend/src/conversations/**"
      - "apps/backend/src/llm/**"
      - "apps/backend/src/logging/**"
    required:
      - docs/current/index.md
      - docs/current/platform/index.md
      - docs/current/platform/agent-runtime.md
      - docs/current/domains/conversations/backend-behavior.md
      - docs/changes/2026-11-07-agent-flow-logging/design.md
      - docs/changes/2026-11-07-agent-flow-logging/verification.md
    optional:
      - docs/current/platform/architecture-and-code-placement.md
      - docs/changes/2026-11-07-agent-flow-logging/worklog.md
      - docs/changes/2026-11-07-conversation-session-persistence/verification.md
    history_on_demand: []
  data-model-implementation:
    description: "Implement or change persistence using the current candidate data model"
    token_budget: 14000
    code_globs:
      - "apps/backend/src/**"
    required:
      - docs/current/index.md
      - docs/current/platform/index.md
      - docs/current/platform/architecture-and-code-placement.md
      - docs/source/data-model-design.md
      - docs/source/data-model-fields.md
    optional:
      - docs/source/system-configuration-design.md
    history_on_demand: []
  agent-streaming-loop:
    description: "Design or implement the single-turn streamed Agent chat across Electron, NestJS, and LLM"
    token_budget: 14000
    code_globs:
      - "apps/desktop/src/**"
      - "apps/desktop/electron/**"
      - "apps/backend/src/agent/**"
      - "apps/backend/src/llm/**"
    required:
      - docs/current/index.md
      - docs/current/platform/index.md
      - docs/current/platform/architecture-and-code-placement.md
      - docs/current/platform/agent-runtime.md
    optional:
      - docs/source/后端架构设计.md
      - docs/source/功能设计文档.md
      - docs/changes/2026-11-06-agent-streaming-loop/design.md
      - docs/changes/2026-11-06-agent-streaming-loop/verification.md
      - docs/changes/2026-11-06-agent-streaming-loop/tasks.md
    history_on_demand: []
  conversation-session-persistence:
    description: "Persist streamed Pi conversation and tool state in SQLite, then rebuild or reconcile history on later requests"
    token_budget: 18000
    code_globs:
      - "apps/backend/src/agent/**"
      - "apps/backend/src/conversations/**"
      - "apps/backend/src/llm/**"
      - "apps/desktop/src/features/agent/**"
      - "apps/desktop/src/types/**"
      - "apps/desktop/electron/**"
    required:
      - docs/current/index.md
      - docs/current/platform/index.md
      - docs/current/platform/architecture-and-code-placement.md
      - docs/current/domains/conversations/index.md
      - docs/current/domains/conversations/backend-behavior.md
      - docs/changes/2026-11-07-conversation-session-persistence/design.md
      - docs/changes/2026-11-07-conversation-session-persistence/verification.md
    optional:
      - docs/current/platform/agent-runtime.md
      - docs/source/data-model-design.md
      - docs/source/data-model-fields.md
      - docs/changes/2026-11-07-conversation-session-persistence/worklog.md
    history_on_demand: []
  conversation-history-sidebar:
    description: "Read and page Conversation history in the desktop Agent UI; keep chat scroll bounded and diagnose HTTP-success/UI-failure across Electron IPC and runtime message conversion"
    token_budget: 18000
    code_globs:
      - "apps/backend/src/conversations/**"
      - "apps/desktop/src/App.tsx"
      - "apps/desktop/src/features/agent/**"
      - "apps/desktop/test/conversation-history.test.cjs"
      - "apps/desktop/electron/**"
    required:
      - docs/current/index.md
      - docs/current/platform/index.md
      - docs/current/platform/agent-runtime.md
      - docs/current/domains/conversations/index.md
      - docs/current/domains/conversations/backend-behavior.md
      - docs/current/domains/conversations/api-contract.md
      - docs/changes/2026-11-07-conversation-history-sidebar/design.md
      - docs/changes/2026-11-07-conversation-history-sidebar/verification.md
    optional:
      - docs/current/platform/architecture-and-code-placement.md
      - docs/changes/2026-11-07-conversation-history-sidebar/worklog.md
      - docs/changes/2026-11-07-conversation-history-sidebar/handoff.md
      - docs/changes/2026-11-07-agent-chat-layout-history-pagination/design.md
      - docs/changes/2026-11-07-agent-chat-layout-history-pagination/verification.md
      - docs/changes/2026-11-07-conversation-session-persistence/design.md
      - docs/changes/2026-11-07-conversation-session-persistence/verification.md
    history_on_demand:
      - docs/postmortems/2026-11-07-conversation-history-runtime.md
  agent-chat-presentation:
    description: "Render per-turn Agent tool activity and assistant Markdown in the desktop chat"
    token_budget: 12000
    code_globs:
      - "apps/desktop/src/features/agent/**"
    required:
      - docs/current/index.md
      - docs/current/platform/index.md
      - docs/current/platform/architecture-and-code-placement.md
      - docs/changes/2026-11-07-agent-chat-presentation/design.md
      - docs/changes/2026-11-07-agent-chat-presentation/verification.md
    optional:
      - docs/current/platform/agent-runtime.md
      - docs/changes/2026-11-06-agent-streaming-loop/design.md
      - docs/changes/2026-11-06-agent-streaming-loop/verification.md
      - docs/changes/2026-11-07-agent-chat-presentation/worklog.md
    history_on_demand: []
  local-agent-settings:
    description: "Configure local Agent providers and style, and enforce workspace file access boundaries"
    token_budget: 22000
    code_globs:
      - "apps/backend/src/settings/**"
      - "apps/backend/src/llm/**"
      - "apps/backend/src/agent/agent.service.ts"
      - "apps/desktop/src/features/agent/**"
      - "apps/desktop/src/features/settings/**"
    required:
      - docs/current/index.md
      - docs/current/platform/index.md
      - docs/current/platform/agent-runtime.md
      - docs/current/domains/system-settings/index.md
      - docs/changes/2026-11-07-local-agent-settings/design.md
      - docs/changes/2026-11-07-local-agent-settings/verification.md
    optional:
      - docs/current/platform/architecture-and-code-placement.md
      - docs/source/system-configuration-design.md
      - docs/changes/2026-11-07-local-agent-settings/tasks.md
      - docs/changes/2026-11-07-local-agent-settings/worklog.md
    history_on_demand: []
  local-workspace-setting:
    description: "Configure the Agent output workspace and enforce current-turn file read/write boundaries"
    token_budget: 24000
    code_globs:
      - "apps/backend/src/settings/**"
      - "apps/backend/src/llm/**"
      - "apps/backend/src/agent/agent.service.ts"
      - "apps/desktop/src/features/agent/**"
      - "apps/desktop/src/features/settings/**"
    required:
      - docs/current/index.md
      - docs/current/platform/index.md
      - docs/current/platform/architecture-and-code-placement.md
      - docs/current/platform/agent-runtime.md
      - docs/current/domains/system-settings/index.md
      - docs/changes/2026-11-07-local-workspace-setting/design.md
      - docs/changes/2026-11-07-local-workspace-setting/verification.md
    optional:
      - docs/changes/2026-11-07-local-workspace-setting/tasks.md
      - docs/changes/2026-11-07-local-workspace-setting/worklog.md
    history_on_demand: []
